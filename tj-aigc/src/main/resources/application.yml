server:
  port: 8094  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: aigc-service
  main:
    allow-circular-references: true # 允许循环引用
  mvc:
    async:
      request-timeout: -1 # SSE 长连接，不能沿用 Tomcat 默认的 30 秒异步超时
  ai:
    mcp:
      client:
        # 服务端尚未启动时不创建连接；联调时启用 mcp profile。
        enabled: false
        name: tianji-aigc-mcp-client
        version: 1.0.0
        type: SYNC
        initialized: true
        request-timeout: 30s
        toolcallback:
          enabled: true

tj:
  swagger:
    enable: true
    package-path: com.tianji.aigc.controller
    title: 天机学堂 - AIGC接口文档
    description: 该服务包含AI相关功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhangzhijun@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
  jdbc:
    database: tj_aigc #指定使用的数据库名
  ai:
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          data-id: route-agent-system-message.txt
        recommend-agent:
          data-id: recommend-agent-system-message.txt
        consult-agent:
          data-id: consult-agent-system-message.txt
        buy-agent:
          data-id: buy-agent-system-message.txt
        knowledge-agent:
          data-id: knowledge-agent-system-message.txt
    memory:
      type: redis # 会话记忆的存储方式：redis 或 mysql
      max: 100
    chat-type: ROUTE # ROUTE / ENHANCE / APP
    dashscope:
      # key 由各环境配置注入，TTS 与 APP 模式复用。
      tts:
        model: cosyvoice-v3-plus
        voice: longanyang
        base-url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
        timeout-ms: 60000
        connect-timeout-ms: 10000
        max-text-length: 2000
